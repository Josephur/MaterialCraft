name: Release

# Builds Linux / Windows / macOS binaries for every commit pushed to main and
# publishes them two ways:
#   1. as run artifacts (the Travis "build row" convention, kept 90 days)
#   2. as a rolling GitHub Release on the `latest` tag, replaced each run
# Tag pushes / pull requests are handled by ci.yml instead.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-latest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  # Gate: a release must never be published from a commit whose tests fail.
  # Runs on Linux only -- it is a gate, not coverage, and ci.yml is what covers
  # the full OS matrix. Cheap enough (~25s) to run ahead of the four builds.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries for the editor
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Tests
        run: cargo test --release

  build:
    name: ${{ matrix.target }}
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
          # macos-latest is Apple Silicon; macos-15-intel is the last x86_64
          # GitHub-hosted image (retired after August 2027).
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: dmg
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux system libraries for the editor
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev \
            rpm fakeroot

      - name: Build (core + editor)
        run: cargo build --release --features gui --bins --target ${{ matrix.target }}

      - name: Smoke test the CLI
        run: cargo run --release --target ${{ matrix.target }} --bin materialcraft -- example smoke

      # ---------------------------------------------------------------- packaging

      # ---------------------------------------------------------------- Linux packages
# AppDir is the single source of truth for the file layout; the tarball, the
# .deb, the .rpm and the AppImage are all derived from it.

      - name: Build the AppDir (Linux)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          A=AppDir
          rm -rf "$A"
          mkdir -p "$A/usr/bin" "$A/usr/share/applications" "$A/usr/share/icons/hicolor/256x256/apps" dist

          install -m 0755 "target/$TARGET/release/materialcraft"     "$A/usr/bin/materialcraft"
          install -m 0755 "target/$TARGET/release/materialcraft-gui" "$A/usr/bin/materialcraft-gui"
          install -m 0644 assets/MaterialCraftLogo.png \
            "$A/usr/share/icons/hicolor/256x256/apps/materialcraft.png"

          cat > "$A/materialcraft.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=MaterialCraft
          Comment=Procedural, node-based material authoring
          Exec=materialcraft-gui
          Icon=materialcraft
          Categories=Graphics;2DGraphics;3DGraphics;
          Terminal=false
          EOF

          install -m 0644 "$A/materialcraft.desktop" "$A/usr/share/applications/materialcraft.desktop"
          install -m 0644 assets/MaterialCraftLogo.png "$A/materialcraft.png"
          touch "$A/materialcraft.AppDir"

      - name: Package .AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="MaterialCraft-$VERSION-$TARGET"
          curl -sSfL -o dist/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x dist/appimagetool

          # APPIMAGE_EXTRACT_AND_RUN lets appimagetool run on a runner with no
          # FUSE. It embeds the runtime ELF, builds the squashfs and patches the
          # header itself -- do not try to assemble a type-2 AppImage by hand,
          # the payload is gzip squashfs, not zstd, and the runtime is embedded
          # by the tool rather than prepended.
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/appimagetool --no-appstream \
            AppDir "dist/$name.AppImage"
          rm -f dist/appimagetool

      - name: Package .deb (Linux)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="MaterialCraft-$VERSION-$TARGET"
          pkg="dist/debmaterialcraft"
          rm -rf "$pkg"
          mkdir -p "$pkg/DEBIAN"

          # The graph library is compiled in via include_str!, so there is no
          # data directory to relocate and no architecture-dependent assets.
          cat > "$pkg/DEBIAN/control" <<EOF
          Package: materialcraft
          Version: $VERSION
          Section: graphics
          Priority: optional
          Architecture: $(dpkg --print-architecture)
          Maintainer: MaterialCraft <noreply@example.com>
          Depends: libc6, libx11-6, libxkbcommon0, libgl1
          Description: Procedural, node-based material authoring engine
           MaterialCraft builds PBR materials from a node graph, with a
           headless renderer, a visual editor and an AI control interface.
          EOF

          cp -r AppDir/usr "$pkg/usr"
          dpkg-deb --root-owner-group --build "$pkg" "dist/$name.deb"

      - name: Package .rpm (Linux)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="MaterialCraft-$VERSION-$TARGET"
          mkdir -p rpmbuild/SPECS rpmbuild/BUILD

          cat > rpmbuild/SPECS/materialcraft.spec <<EOF
          Name:           materialcraft
          Version:        $VERSION
          Release:        1%{?dist}
          Summary:        Procedural, node-based material authoring engine
          License:        MIT AND Apache-2.0
          URL:            https://github.com/Josephur/MaterialCraft
          BuildArch:      x86_64
          Requires:       glibc, libX11, libxkbcommon, mesa-libGL

          %description
          MaterialCraft builds PBR materials from a node graph, with a
          headless renderer, a visual editor and an AI control interface.

          %prep

          %build

          # Without this section BUILDROOT stays empty and every entry under
          # %files fails with "File not found". %{_appdir} is passed in with
          # --define so this does not depend on rpmbuild's working directory.
          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          install -m 0755 %{_appdir}/usr/bin/materialcraft     %{buildroot}/usr/bin/materialcraft
          install -m 0755 %{_appdir}/usr/bin/materialcraft-gui %{buildroot}/usr/bin/materialcraft-gui
          install -m 0644 %{_appdir}/usr/share/applications/materialcraft.desktop %{buildroot}/usr/share/applications/materialcraft.desktop
          install -m 0644 %{_appdir}/materialcraft.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/materialcraft.png

          %files
          /usr/bin/materialcraft
          /usr/bin/materialcraft-gui
          /usr/share/applications/materialcraft.desktop
          /usr/share/icons/hicolor/256x256/apps/materialcraft.png
          EOF

          rpmbuild --define "_topdir $PWD/rpmbuild" \
                   --define "_appdir $PWD/AppDir" \
                   -bb rpmbuild/SPECS/materialcraft.spec
          # Locate the built rpm rather than guessing the arch directory. The
          # %{_arch} macro is expanded by rpm inside a spec file, NOT by the
          # shell, so it cannot be used on this command line.
          rpm=$(find rpmbuild/RPMS -name "materialcraft-$VERSION-*.rpm" | head -1)
          [ -n "$rpm" ] || { echo "rpmbuild produced no rpm under rpmbuild/RPMS"; exit 1; }
          cp "$rpm" "dist/$name.rpm"

      - name: Package tarball (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          name="MaterialCraft-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          stage="stage/$name"
          mkdir -p "$stage" dist
          install -m 0755 "target/${{ matrix.target }}/release/materialcraft" "$stage/materialcraft"
          install -m 0755 "target/${{ matrix.target }}/release/materialcraft-gui" "$stage/materialcraft-gui"
          cp LICENSE-APACHE LICENSE-MIT NOTICE README.md "$stage/"
          cp -r library "$stage/library"
          tar -czf "dist/$name.tar.gz" -C stage "$name"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name    = "MaterialCraft-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          $rel     = "target/${{ matrix.target }}/release"
          $stage   = "stage/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # -Path/-Destination must be explicit: "a", "b" binds both to -Path.
          Copy-Item -Path "$rel/materialcraft.exe"     -Destination "$stage/materialcraft.exe"
          Copy-Item -Path "$rel/materialcraft-gui.exe" -Destination "$stage/materialcraft-gui.exe"
          Copy-Item LICENSE-APACHE, LICENSE-MIT, NOTICE, README.md $stage
          Copy-Item library $stage -Recurse
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"

      - name: Package (macOS .app bundle + .dmg)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          name="MaterialCraft-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          stage="stage/dmg"
          app="$stage/MaterialCraft.app"
          rel="target/${{ matrix.target }}/release"

          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          install -m 0755 "$rel/materialcraft-gui" "$app/Contents/MacOS/materialcraft-gui"
          cp assets/MaterialCraftLogo.png "$app/Contents/Resources/"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>MaterialCraft</string>
            <key>CFBundleDisplayName</key><string>MaterialCraft</string>
            <key>CFBundleExecutable</key><string>materialcraft-gui</string>
            <key>CFBundleIdentifier</key><string>org.materialcraft.editor</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${{ needs.version.outputs.version }}</string>
            <key>CFBundleVersion</key><string>${{ needs.version.outputs.version }}</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # The headless CLI travels next to the bundle, uninstalled and ready.
          install -m 0755 "$rel/materialcraft" "$stage/materialcraft"
          cp LICENSE-APACHE LICENSE-MIT NOTICE README.md "$stage/"
          cp -r library "$stage/library"
          ln -s /Applications "$stage/Applications"

          hdiutil create -volname MaterialCraft -srcfolder "$stage" -ov -format UDZO "dist/$name.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  # ===========================================================================
  # TODO(1.0): switch from the rolling `latest` prerelease to real releases.
  #
  # Everything below publishes a single moving tag (`latest`), overwritten on
  # every push to main and flagged `prerelease: true`. That is a development
  # channel, not a release: it has no history, no stable download URL and no
  # version in its name.
  #
  # When MaterialCraft hits 1.0, switch to proper semver releases tagged
  # `materialcraft-v<version>`.
  #
  # MaterialCraft is destined to join the ArtCraft suite, so `artcraft-v<version>`
  # is the target convention (see storytold/artcraft, currently `artcraft-v0.41.0`).
  # Until then this repo has used bare semver -- `0.2.0`, `0.3.0` -- plus a
  # `beta` release that has gone stale. Both schemes will coexist in the tag
  # history after the switch; that is fine, GitHub does not care, and it records
  # the transition honestly rather than pretending the bare tags never existed.
  #
  # To do it:
  #   1. Bump `version` in Cargo.toml to 1.0.0 -- this job already reads it and
  #      passes it through as needs.version.outputs.version.
  #   2. Change `on:` at the top of this file from `push: branches: [main]` to
  #      either `push: tags: ['materialcraft-v*']` (build per release) or a
  #      dedicated `release` branch. Note that ArtCraft itself triggers on
  #      pushes to `release` / `artcraft-release` and cuts the tag by hand, so
  #      mirroring that is the more faithful choice if the two are to share a
  #      release process. If MaterialCraft is eventually built by ArtCraft's own
  #      publish workflows, this file may be retired outright rather than
  #      converted.
  #   3. Delete the "Move the rolling tag" step entirely; a tag push already
  #      points the tag at the right commit.
  #   4. In the step below: `tag_name: ${{ needs.version.outputs.tag }}`,
  #      `name: ${{ needs.version.outputs.version }}`, and drop `prerelease: true`.
  #      Derive the full tag in the `version` job with
  #      `echo "tag=materialcraft-v$v" >> "$GITHUB_OUTPUT"` and export it.
  #   5. Consider renaming the archives to the suite's underscore style,
  #      `MaterialCraft_<version>_<target>.<ext>`, so they sit alongside
  #      `ArtCraft_0.41.0_x64-setup.exe` in the Craft launcher.
  #
  # Keep the rolling `latest` channel in place until 1.0 actually ships -- it is
  # the only way for contributors to grab an unreleased build today.
  # ===========================================================================
  publish:
    name: Publish rolling `latest` release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS

      # Keep `latest` pointed at this commit, whether or not the tag existed yet.
      - name: Move the rolling tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/ref/tags/latest" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA"
          fi

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest (${{ needs.version.outputs.sha }})
          prerelease: true
          body: |
            Rolling build of the most recent commit on `main`.

            Rebuilt from scratch on every push, so these assets are replaced
            each time. For a stable, dated release use a `v*` tag instead.

          commit_creator: github-actions[bot]
          overwrite_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/SHA256SUMS