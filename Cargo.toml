[package]
name = "matforge"
version = "0.1.0"
edition = "2021"
description = "Procedural, node-based material authoring engine (Substance Designer-style) in pure Rust"
license = "MIT"

[features]
default = []
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
eframe = { version = "0.29", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }

[[bin]]
name = "matforge"
path = "src/main.rs"

[[bin]]
name = "matforge-gui"
path = "src/gui.rs"
required-features = ["gui"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
