[package]
name = "materialcraft"
version = "0.1.0"
edition = "2021"
description = "Procedural, node-based material authoring engine in pure Rust"
license = "MIT OR Apache-2.0"
readme = "README.md"

[features]
default = []
gui = ["dep:eframe", "dep:rfd", "gpu"]
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
wgpu = { version = "22", optional = true, default-features = false, features = ["wgsl", "dx12", "metal"] }
pollster = { version = "0.3", optional = true }
eframe = { version = "0.29", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }

[[bin]]
name = "materialcraft"
path = "src/main.rs"

[[bin]]
name = "materialcraft-gui"
path = "src/gui.rs"
required-features = ["gui"]

[[example]]
name = "gpu_shot"
path = "examples/gpu_shot.rs"
required-features = ["gui"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
